application:
  name: zenml
  pods:
  - name: app
    image: mirror.gcr.io/zenmldocker/zenml-server:latest
    path: /
    servicePorts:
    - 8080
    vars:
      ZENML_SERVER_DEPLOYMENT_TYPE: local
      ZENML_CONFIG_PATH: /tmp/zenml
      ZENML_DEFAULT_STORE_TYPE: sql
      ZENML_STORE_URL: "sqlite:////tmp/zenml/store.db"
