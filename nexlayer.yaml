application:
  name: zenml
  pods:
  - name: app
    image: mirror.gcr.io/zenmldocker/zenml-server:latest
    path: /
    servicePorts:
    - 8080
    vars:
      ZENML_SERVER_DEPLOYMENT_TYPE: local
      DATABASE_URL: "sqlite:////zenml/.zen/config.db"
    volumes:
    - name: zenml-data
      mountPath: /zenml
      size: 5Gi
